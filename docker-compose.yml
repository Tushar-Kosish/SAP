version: '3.8'

services:
  smartevac-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartevac_ai_unified
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///./smartevac_local.db
    volumes:
      - smartevac_data:/app/data
    restart: always

volumes:
  smartevac_data:
